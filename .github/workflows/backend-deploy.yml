name: Backend CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-backend:
    name: Build Docker Image, Push to ECR & Deploy to ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./server

          echo "Pushing Docker image to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download active Task Definition from ECS
        id: download-task-def
        run: |
          TASK_DEF_NAME="${{ secrets.ECS_TASK_DEFINITION }}"
          if [ -z "$TASK_DEF_NAME" ]; then
            echo "ℹ️ ECS_TASK_DEFINITION secret not configured yet. ECR image push complete."
            exit 0
          fi

          echo "Fetching latest task definition for family $TASK_DEF_NAME..."
          aws ecs describe-task-definition --task-definition "$TASK_DEF_NAME" --query taskDefinition > task-def.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > clean-task-def.json

          # Auto-extract container name from active task definition if ECS_CONTAINER_NAME is not set
          CONTAINER_NAME="${{ secrets.ECS_CONTAINER_NAME }}"
          if [ -z "$CONTAINER_NAME" ]; then
            CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' clean-task-def.json)
          fi
          echo "Detected ECS Container Name: $CONTAINER_NAME"
          echo "container_name=$CONTAINER_NAME" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS Task Definition
        id: render-task-def
        if: ${{ steps.download-task-def.outputs.container_name != '' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-def.json
          container-name: ${{ steps.download-task-def.outputs.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS Task Definition & Wait for Stability
        if: ${{ steps.download-task-def.outputs.container_name != '' && secrets.ECS_SERVICE != '' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
