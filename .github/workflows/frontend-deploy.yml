name: Frontend CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    name: Build & Deploy Static Frontend to AWS S3 & CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build static frontend
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.VITE_API_BASE_URL || secrets.NEXT_PUBLIC_API_URL || vars.VITE_API_BASE_URL || vars.NEXT_PUBLIC_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || secrets.NEXT_PUBLIC_API_URL || vars.VITE_API_BASE_URL || vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync dist/ to Amazon S3
        run: |
          echo "Syncing frontend build output to S3 bucket..."
          aws s3 sync client/dist s3://${{ secrets.FRONTEND_S3_BUCKET || secrets.AWS_S3_BUCKET_NAME }} --delete --no-progress

      - name: Invalidate CloudFront cache
        run: |
          echo "Creating CloudFront invalidation..."
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
